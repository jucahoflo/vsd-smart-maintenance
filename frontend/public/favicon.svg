<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6C63FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF6B6B;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8B83FF;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#FF8E8E;stop-opacity:0.8" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Círculo exterior -->
  <circle cx="50" cy="50" r="45" fill="none" stroke="url(#grad1)" stroke-width="3" opacity="0.3"/>
  
  <!-- Símbolo VFD estilizado -->
  <g filter="url(#glow)">
    <!-- Línea de energía central -->
    <line x1="35" y1="25" x2="35" y2="75" stroke="url(#grad1)" stroke-width="4" stroke-linecap="round"/>
    <line x1="65" y1="25" x2="65" y2="75" stroke="url(#grad1)" stroke-width="4" stroke-linecap="round"/>
    
    <!-- Conexiones de energía -->
    <line x1="20" y1="35" x2="35" y2="35" stroke="url(#grad2)" stroke-width="3" stroke-linecap="round"/>
    <line x1="20" y1="50" x2="35" y2="50" stroke="url(#grad2)" stroke-width="3" stroke-linecap="round"/>
    <line x1="20" y1="65" x2="35" y2="65" stroke="url(#grad2)" stroke-width="3" stroke-linecap="round"/>
    
    <line x1="65" y1="35" x2="80" y2="35" stroke="url(#grad2)" stroke-width="3" stroke-linecap="round"/>
    <line x1="65" y1="50" x2="80" y2="50" stroke="url(#grad2)" stroke-width="3" stroke-linecap="round"/>
    <line x1="65" y1="65" x2="80" y2="65" stroke="url(#grad2)" stroke-width="3" stroke-linecap="round"/>
  </g>
  
  <!-- Puntos de luz -->
  <circle cx="35" cy="25" r="3" fill="#6C63FF" opacity="0.8"/>
  <circle cx="35" cy="75" r="3" fill="#FF6B6B" opacity="0.8"/>
  <circle cx="65" cy="25" r="3" fill="#FF6B6B" opacity="0.8"/>
  <circle cx="65" cy="75" r="3" fill="#6C63FF" opacity="0.8"/>
  
  <!-- Texto VSD -->
  <text x="50" y="95" text-anchor="middle" font-family="Inter, sans-serif" font-weight="800" font-size="12" fill="#6C63FF">VSD</text>
</svg>
